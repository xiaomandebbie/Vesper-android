# /etc/nginx/conf.d/android-bridge.conf
# 只在这台机器的 443 由 Nginx 管的时候用这一份。443 在 Caddy 手里就用 deploy/Caddyfile.snippet。

server {
    listen 80;
    listen [::]:80;
    server_name android.vesperphosphor.online;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name android.vesperphosphor.online;

    # 用泛域名证书的话换成 /etc/letsencrypt/live/vesperphosphor.online/
    ssl_certificate     /etc/letsencrypt/live/android.vesperphosphor.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/android.vesperphosphor.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安卓 Portal 反向连接（WebSocket，长连接）
    location /android/join {
        proxy_pass http://127.0.0.1:18765/android/join;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 手机会挂着不说话，别让 Nginx 掐断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Aru 的 MCP 连接
    location /mcp {
        proxy_pass http://127.0.0.1:18766/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # 写死 Origin：Aru 不是浏览器，不一定带 Origin，
        # 而 MCP 侧开着 DNS rebinding 保护，缺了会 400 Invalid Origin。
        proxy_set_header Origin "https://android.vesperphosphor.online";

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        # 原指南写的 16m / 4 16m 是每条连接 64MB，没必要；截图大小不受这里限制
        proxy_buffer_size 128k;
        proxy_buffers 8 128k;

        # 截图是从手机往上走的，这里只管 Aru 发上来的请求体
        client_max_body_size 20m;
        proxy_read_timeout 120s;
    }

    location / { return 404; }
}
